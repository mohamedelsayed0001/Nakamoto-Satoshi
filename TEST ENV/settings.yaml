# ============================================================================
#  SHARED EXPERIMENT SETTINGS — every approach runs under exactly these.
#  Baseline: Fashion-MNIST + MLP, non-IID clients, heterogeneous devices, fixed virtual-time budget.
#  Values marked (tuned) were chosen by tuning.ipynb for synchronous FedAvg.
#  To reproduce the original MNIST notebooks instead, use settings_mnist_reference.yaml.
# ============================================================================

# ---------- data ----------
dataset: mnist       # mnist | fashion_mnist
data_dir: ../data           # relative to this folder
train_samples: 12000        # images shared out to clients (of 60,000)
validation_samples: 5000    # held-out training images, used to score tuning
test_samples: 2000          # of 10,000; touched only for the final report
partition: dirichlet        # iid | dirichlet
dirichlet_alpha: 0.5        # smaller = more non-IID

# ---------- clients / local training ----------
num_clients: 10             # (tuned)
local_epochs: 2             # matches the outer test notebooks
batch_size: 64              # matches the outer test notebooks
lr: 0.03                    # matches the outer test notebooks
momentum: 0.9
model: simple_nn            # simple_nn (MLP) | cnn | cifar_cnn

# ---------- devices (heterogeneity) ----------
# Use "random" so these settings work for any num_clients value.
speeds: random              # generated independently for each client
download_latency: random    # generated independently for each client
upload_latency: random      # generated independently for each client
random_spread: 0.8          # bigger = more heterogeneous (lognormal sigma)
speed_batch_size: 64        # a batch of 32 costs half as long as a batch of 64

# ---------- simulation budget ----------
time_quantum: 1.0
max_updates: 100              # matches 5 rounds x 10 clients in the outer tests
max_time: null              # ... every approach gets the same 3000 virtual seconds

# ---------- runs ----------
seeds: [42]                 # use 3+ seeds for real comparisons
eval_every: 1               # (used only when eval_interval is null)
eval_interval: 10          # evaluate every 100 virtual seconds
shared_shuffle_rng: true    # matches the outer test notebooks
device: auto                # auto | cpu | cuda
